{% extends "includes/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block main-content %}
<div class="max-w-4xl mx-auto mb-8">
    <div class="mb-6">
        <a href="{{ back_url }}" class="text-sm text-gray-500 hover:text-gray-700">
            <i class="fas fa-arrow-left mr-1"></i>Volver
        </a>
        <h1 class="text-2xl sm:text-3xl font-lora font-bold text-gray-900 mt-1">{{ page_title }}</h1>
    </div>
    <div class="bg-white rounded-xl shadow-lg p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
            {% for row in detail_rows %}
                {% if row.label != "municipio" and row.label != "parent" %}
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wide">{{ row.label }}</p>
                        <p class="font-medium text-gray-900">{{ row.value }}</p>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
