{% extends "includes/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block main-content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-3">{{ page_title }}</h1>
        <p class="text-gray-700 mb-6">Vas a eliminar: <strong>{{ object }}</strong></p>

        <form method="post" class="flex gap-3 justify-end">
            {% csrf_token %}
            <a href="{{ back_url }}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                Cancelar
            </a>
            <button type="submit" class="px-5 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">
                Eliminar
            </button>
        </form>
    </div>
</div>
{% endblock %}
