services:
  web:
    build: .
    container_name: nodo-web
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8001"
    env_file:
      - .env.production
    environment:
      - RUN_MIGRATIONS=true
      - RUN_CREAR_PROGRAMAS=true
      - RUN_COLLECTSTATIC=true
      - RUN_CREAR_SUPERADMIN=true
    entrypoint: ["/app/docker-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - nodo-network
    mem_limit: 350m
    memswap_limit: 500m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      timeout: 10s
      retries: 3

  websocket:
    build: .
    container_name: nodo-websocket
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    restart: unless-stopped
    networks:
      - nodo-network
    mem_limit: 300m
    memswap_limit: 500m

  # Celery worker para AI Squad y tareas asíncronas
  celery:
    build: .
    container_name: nodo-celery
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    env_file:
      - .env.production
    command: celery -A config worker -l INFO --concurrency=2
    restart: unless-stopped
    networks:
      - nodo-network
    mem_limit: 400m
    memswap_limit: 600m
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

  # Redis para Celery, cache y WebSocket
  redis:
    image: redis:7-alpine
    container_name: nodo-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - nodo-network
    mem_limit: 300m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nodo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/staticfiles:ro
      - ./media:/media:ro
      - ./nginx-selfsigned.crt:/etc/nginx/ssl/nginx-selfsigned.crt:ro
      - ./nginx-selfsigned.key:/etc/nginx/ssl/nginx-selfsigned.key:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - nodo-network

networks:
  nodo-network:
    driver: bridge

volumes:
  redis_data:
