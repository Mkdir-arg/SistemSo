{% load static %}
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Nueva contraseña - Portal Ciudadano</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:"Inter",sans-serif;background:#fff;color:#101828;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{max-width:440px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:32px}
h1{margin:0 0 24px;font-size:22px;font-weight:700}
.field{margin-bottom:16px}.field label{display:block;margin-bottom:6px;font-size:14px;font-weight:500}
.field input{width:100%;height:40px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb;font-size:14px;padding:0 12px;outline:none}
.field input:focus{border-color:#8a35c8;box-shadow:0 0 0 3px rgba(138,53,200,.15)}
.submit{width:100%;height:40px;border:0;border-radius:10px;background:linear-gradient(45deg,#7928ca,#ff0080);color:#fff;font-size:14px;font-weight:500;cursor:pointer}</style>
</head><body>
<div class="card">
    <h1>Nueva contraseña</h1>
    {% if validlink %}
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="field"><label>Nueva contraseña</label><input type="password" name="new_password1" placeholder="Mínimo 8 caracteres"></div>
        <div class="field"><label>Confirmar contraseña</label><input type="password" name="new_password2" placeholder="Repetí la contraseña"></div>
        {% if form.errors %}<p style="color:#b42318;font-size:13px">{{ form.errors }}</p>{% endif %}
        <button type="submit" class="submit">Guardar contraseña</button>
    </form>
    {% else %}
    <p style="color:#b42318">El enlace no es válido o ya fue utilizado. <a href="/portal-ciudadano/password/reset/" style="color:#7928ca">Solicitá uno nuevo</a>.</p>
    {% endif %}
</div>
</body></html>
