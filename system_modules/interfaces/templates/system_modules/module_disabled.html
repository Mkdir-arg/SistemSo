<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Modulo no disponible</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f8fafc;
                color: #1f2937;
            }
            .layout {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .card {
                width: 100%;
                max-width: 560px;
                background: #ffffff;
                border: 1px solid #e5e7eb;
                border-radius: 18px;
                padding: 32px;
                box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
            }
            h1 {
                margin: 0 0 12px;
                font-size: 28px;
            }
            p {
                margin: 0 0 12px;
                line-height: 1.5;
            }
            .badge {
                display: inline-block;
                margin-bottom: 16px;
                padding: 6px 12px;
                border-radius: 999px;
                background: #fee2e2;
                color: #991b1b;
                font-size: 13px;
                font-weight: 600;
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <div class="card">
                <div class="badge">403 · modulo no disponible</div>
                <h1>{{ display_name }}</h1>
                <p>{{ message }}</p>
                <p>Los datos siguen preservados, pero la funcionalidad esta bloqueada para esta instancia.</p>
                <p>Si necesitas habilitarla, contacta a un administrador del sistema.</p>
            </div>
        </div>
    </body>
</html>
